[package]
name = "configdeck"
version = "0.1.1"
license = "Apache-2.0"
description = "Edit JSON, JSONC, YAML and TOML configuration as forms"
authors = ["Stefan <st.wuthrich@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "configdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
# No HTTP/file `$ref` retrieval: the app never touches the network for schemas.
jsonschema = { version = "0.60.1", default-features = false, features = ["idna"] }
toml_edit = "0.25.17"
yaml-edit = "0.3.5"
thiserror = "2.0.21"
sha2 = "0.11.1"
tempfile = "3.27.0"
uuid = { version = "1.29.0", features = ["v4"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tauri-plugin-dialog = "2.8.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
